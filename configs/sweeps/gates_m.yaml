# Gates study, size M canonical (8L d512, tinystories). Includes lr_mult=100 sensitivity arm.
name: gates_m
base: ../gates/gate_m.yaml
seeds: [0, 1, 2]
variants:
  plain:    {model.residual: {name: plain}}
  gated1:   {model.residual: {name: gated}, optim.groups: [{match: "res_", lr_mult: 1, weight_decay: 0}]}
  gated30:  {model.residual: {name: gated}, optim.groups: [{match: "res_", lr_mult: 30, weight_decay: 0}]}
  gated100: {model.residual: {name: gated}, optim.groups: [{match: "res_", lr_mult: 100, weight_decay: 0}]}
