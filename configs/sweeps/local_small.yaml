# Local vs global attention, small scale (seq 256, ~1.9M params). Windows are seq/8, seq/4, seq/2.
# Hybrid ratios (global:local) over 4 layers: 11 = {0,2} global / {1,3} local; 13 = {0} global / {1,2,3} local.
#   gpt sweep configs/sweeps/local_small.yaml
name: local_small
base: ../edu_small.yaml
seeds: [0, 1, 2]
variants:
  mha:        {model.attention: {name: mha}}
  local_w32:  {model.attention: {name: local, window: 32}}
  local_w64:  {model.attention: {name: local, window: 64}}
  local_w128: {model.attention: {name: local, window: 128}}
  hybrid_11:  {model.attention: [{layers: "0::2", name: mha}, {layers: all, name: local, window: 64}]}
  hybrid_13:  {model.attention: [{layers: 0, name: mha}, {layers: all, name: local, window: 64}]}
