  A: {model.extra.layout: "MMAAMAAMAAMAAMMM"}
  B: {model.extra.layout: "AAAMMAMMAMMAMMAA"}
  C: {model.extra.layout: "MMMMAAAAAAAAMMMM"}
  D: {model.extra.layout: "AAAAMMMMMMMMAAAA"}
  sandwich: {model.extra.layout: "AAAAMAMAMAMAMMMM"}
