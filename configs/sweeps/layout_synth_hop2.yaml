# Synthetic task hop2 (data: synth_hop2): 16 sublayers d=128, 6 layouts x 3 seeds.
name: layout_synth_hop2
base: ../layouts/synth_base.yaml
common: {'data.name': 'synth_hop2', 'train.max_steps': 25000}
seeds: [0, 1, 2]
variants:
