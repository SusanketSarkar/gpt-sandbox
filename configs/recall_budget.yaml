# Base for the global-attention-budget study (easier recall task, window-4 local mixer).
# 8 layers -> ratios 1.0/0.5/0.25/0.125/0.0 give 8/4/2/1/0 global layers.
name: recall_budget
seed: 1337
data: {name: synth_recall}
model:
  n_layer: 8
  d_model: 128
  n_head: 4
  seq_len: 160
  dropout: 0.0
optim: {lr: 2.0e-3, weight_decay: 0.05}
train:
  max_steps: 4000
  batch_size: 32
  warmup_steps: 100
  eval_interval: 500
  log_interval: 100
eval:
  max_batches: 64
