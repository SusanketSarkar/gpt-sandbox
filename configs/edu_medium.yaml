# Medium long-context run on edu_mix (~29M params, seq 512). Stronger test of local vs global attention.
name: edu_medium
seed: 1337
data: {name: edu_mix}
model:
  n_layer: 8
  d_model: 512
  n_head: 8
  seq_len: 512
  dropout: 0.0
  attention: {name: mha}
optim: {lr: 5.0e-4, weight_decay: 0.1, betas: [0.9, 0.95]}
train:
  max_steps: 16000
  batch_size: 32
  grad_clip: 1.0
  warmup_steps: 400
  eval_interval: 500
  eval_batches: 16
  log_interval: 50
  save_interval: 5000
eval:
  batch_size: 16
  max_batches: 128            # ~1.05M val tokens for the final eval (capped, not the full 5.2M)
  metrics: [params, val, position, calibration, baselines, induction, long_recall, throughput]
