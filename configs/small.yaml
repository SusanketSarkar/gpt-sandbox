# ~25M params, BPE-4096 TinyStories. Wants a GPU.  gpt data curate -c configs/data/tinystories.yaml
base: tiny.yaml
name: small
data: {name: tinystories}
model: {n_layer: 8, d_model: 512, n_head: 8, seq_len: 512}
optim: {lr: 1.0e-3}
train: {max_steps: 5000, batch_size: 32, warmup_steps: 200, eval_interval: 250, log_interval: 50}
