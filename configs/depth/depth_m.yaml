# Depth-fragility study, size M: 8L d512 h8 seq 512, edu_mix (~29M params).
# Identical budget to gates_m_edu so the plain runs should land near val_bpb ~ 1.036.
# Anchor depths: first = L0, middle = L4, last = L7.
name: depth_m
seed: 1337
data: {name: edu_mix}
model:
  n_layer: 8
  d_model: 512
  n_head: 8
  seq_len: 512
  dropout: 0.0
  attention: {name: mha}
optim: {lr: 1.0e-3, weight_decay: 0.1, betas: [0.9, 0.95]}
train:
  max_steps: 10000
  batch_size: 32
  grad_clip: 1.0
  warmup_steps: 400
  eval_interval: 500
  eval_batches: 16
  log_interval: 50
  save_interval: 5000
eval:
  batch_size: 16
  max_batches: 128
  metrics: [params, val, position, calibration, generalization, baselines, induction, generation, throughput]
