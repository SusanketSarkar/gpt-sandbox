# layout_schedule_2 — synthetic-task base: 24 sublayers, d=128, char tokenizer.
# The sweep files set `data.name` to the task dataset (synth_local_rule | synth_recall | synth_hop2).
name: ratio2_synth
seed: 1337
data: {name: synth_recall}
model:
  n_layer: 24
  d_model: 128
  n_head: 8
  seq_len: 128
  dropout: 0.0
  block: {name: layout}
  attention: {name: mha}
  mlp: {name: swiglu}
  extra:
    layout: "AMAMAMAMAMAMAMAMAMAMAMAM"
optim: {lr: 1.0e-3, betas: [0.9, 0.95], weight_decay: 0.05}
train:
  max_steps: 20000
  batch_size: 128
  grad_clip: 1.0
  warmup_steps: 500
  schedule: {name: cosine, min_lr_ratio: 0.1}
  eval_interval: 1000
  eval_batches: 16
  log_interval: 200
  save_interval: 5000
  final_eval: true
eval:
  batch_size: 16
  max_batches: 128
  task_samples: 200
  metrics: [params, val, task, calibration, induction, long_recall, generation, throughput]
  deep_metrics: [logit_lens, layer_ablation, ctx_sensitivity]
