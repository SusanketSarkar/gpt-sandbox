# Jumbo layout-schedule base: 24 transformer layers = 48 sublayers (24 A + 24 M), d=512.
# The unit is the SUBLAYER: every block runs exactly one op (attention or MLP), chosen by
# `model.extra.layout` (one char per block). The alternating baseline is "AM"*24, and it is
# built through the same layout plugin as every other variant, so init scales / norms /
# residuals are identical across the sweep - only the order (or the A/M multiset) differs.
#
#   gpt check -c configs/layouts/jumbo_base.yaml
#   gpt info  -c configs/layouts/jumbo_base.yaml
name: layout_jumbo
seed: 1337
data: {name: edu_mix}
model:
  n_layer: 48            # = number of sublayers = len(extra.layout)
  d_model: 512
  n_head: 8
  seq_len: 256
  dropout: 0.0
  block: {name: layout}
  attention: {name: mha}
  mlp: {name: swiglu}
  extra:
    layout: "AMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAM"   # 24 A + 24 M
optim: {lr: 6.0e-4, betas: [0.9, 0.95], weight_decay: 0.1}
train:
  max_steps: 10000
  batch_size: 128
  grad_clip: 1.0
  warmup_steps: 400
  schedule: {name: cosine, min_lr_ratio: 0.1}
  eval_interval: 500
  eval_batches: 16
  log_interval: 100
  save_interval: 4000
  final_eval: true
eval:
  batch_size: 16
  max_batches: 256
  metrics: [params, val, position, calibration, baselines, induction, generalization, generation, throughput]
  deep_metrics: [logit_lens, layer_ablation, ctx_sensitivity]
