# layout_schedule_2 — jumbo ratio-sweep base.
# 48 sublayers, d=512, 8 heads, seq 256, batch 128. The sweep varies the A/M COUNTS
# (model.extra.layout) and, for the param-matched family, d_ff (model.mlp.d_ff).
#
#   gpt check -c configs/layouts/ratio2_jumbo.yaml
#   gpt info  -c configs/layouts/ratio2_jumbo.yaml
name: ratio2_jumbo
seed: 1337
data: {name: edu_mix}
model:
  n_layer: 48            # = number of sublayers = len(extra.layout)
  d_model: 512
  n_head: 8
  seq_len: 256
  dropout: 0.0
  block: {name: layout}
  attention: {name: mha}
  mlp: {name: swiglu}
  extra:
    layout: "AMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAMAM"   # 24 A + 24 M (1:1 anchor)
optim: {lr: 6.0e-4, betas: [0.9, 0.95], weight_decay: 0.1}
train:
  max_steps: 6000
  batch_size: 128
  grad_clip: 1.0
  warmup_steps: 400
  schedule: {name: cosine, min_lr_ratio: 0.1}
  eval_interval: 500
  eval_batches: 16
  log_interval: 100
  save_interval: 4000
  final_eval: true
eval:
  batch_size: 16
  max_batches: 256
  task_samples: 200
  metrics: [params, val, position, calibration, baselines, induction, generalization, generation, task, throughput, long_recall]
  deep_metrics: [logit_lens, layer_ablation, ctx_sensitivity]
