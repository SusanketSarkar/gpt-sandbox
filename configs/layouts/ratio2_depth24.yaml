# layout_schedule_2 — depth ablation base: 24 sublayers, d=256, edu_mix.
# Same ratio grid as the jumbo sweep, at half depth, to check the curve shape holds.
name: ratio2_depth24
seed: 1337
data: {name: edu_mix}
model:
  n_layer: 24
  d_model: 256
  n_head: 8
  seq_len: 256
  dropout: 0.0
  block: {name: layout}
  attention: {name: mha}
  mlp: {name: swiglu}
  extra:
    layout: "AMAMAMAMAMAMAMAMAMAMAMAM"   # 12 A + 12 M (1:1 anchor)
optim: {lr: 6.0e-4, betas: [0.9, 0.95], weight_decay: 0.1}
train:
  max_steps: 12000
  batch_size: 128
  grad_clip: 1.0
  warmup_steps: 400
  schedule: {name: cosine, min_lr_ratio: 0.1}
  eval_interval: 500
  eval_batches: 16
  log_interval: 100
  save_interval: 4000
  final_eval: true
eval:
  batch_size: 16
  max_batches: 256
  task_samples: 200
  metrics: [params, val, position, calibration, baselines, induction, generalization, generation, task, throughput, long_recall]
  deep_metrics: [logit_lens, layer_ablation, ctx_sensitivity]
